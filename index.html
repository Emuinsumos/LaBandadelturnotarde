<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#E9EEE9; }
  .cuadrito { width:16px; height:16px; border-radius:3px; display:inline-block; margin-right:2px; }
  .foto-jugador { width:56px; height:56px; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); object-fit:cover; background:#232B25; }

  /* ===== Landing / Dashboard premium (solo Home) ===== */
  .landing-dark {
    background:
      radial-gradient(circle at 15% 0%, rgba(92,191,74,0.16), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(255,215,0,0.07), transparent 40%),
      linear-gradient(180deg, #0C100D 0%, #121813 40%, #171E18 100%);
    color: #EEF3EE;
  }
  .glass {
    background: rgba(30, 40, 32, 0.62);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(140,230,120,0.12);
  }
  .glass-hover { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .glass-hover:hover { transform: translateY(-4px); border-color: rgba(140,230,120,0.4); }

  .foto-podio { width:76px; height:76px; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); object-fit:cover; background:#232B25; }
  .hex { clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); }
  .foto-podio-frame { padding:3px; border-radius:0; display:inline-block; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); line-height:0; }
  .hex-glow-oro { filter: drop-shadow(0 0 12px rgba(255,215,0,0.6)); }
  .hex-glow-plata { filter: drop-shadow(0 0 10px rgba(220,220,220,0.5)); }
  .hex-glow-bronce { filter: drop-shadow(0 0 10px rgba(205,127,50,0.55)); }
  .hex-glow-verde { filter: drop-shadow(0 0 10px rgba(92,191,74,0.55)); }
  .display { font-family: 'Barlow Condensed','Arial Narrow',system-ui,sans-serif; letter-spacing:.03em; }
  .hexpat { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><g fill='none' stroke='%235CBF4A' stroke-opacity='0.07' stroke-width='1.5'><path d='M14 0 L42 0 L56 24 L42 48 L14 48 L0 24 Z'/><path d='M42 48 L70 48 M0 24 L-14 48 L0 72 L14 48 M14 48 L0 72 L14 97 L42 97 L56 72 L42 48'/></g></svg>"); }
  .frame-oro { background: conic-gradient(from 0deg, #FFD700, #FFF6C4, #FFD700, #B8860B, #FFD700); }
  .frame-verde { background: conic-gradient(from 0deg, #3E9B33, #A8F59A, #5CBF4A, #2E7D32, #3E9B33); }
  .frame-plata { background: conic-gradient(from 0deg, #E8E8E8, #FFFFFF, #C0C0C0, #9A9A9A, #E8E8E8); }
  .frame-bronce { background: conic-gradient(from 0deg, #CD7F32, #F0C89A, #CD7F32, #8A5222, #CD7F32); }

  .card-oro { border: 1px solid rgba(255,215,0,0.5); box-shadow: 0 0 30px -6px rgba(255,215,0,0.35); }
  .card-plata { border: 1px solid rgba(220,220,220,0.5); box-shadow: 0 0 24px -6px rgba(220,220,220,0.3); }
  .card-bronce { border: 1px solid rgba(205,127,50,0.5); box-shadow: 0 0 24px -6px rgba(205,127,50,0.3); }

  .badge-neon { text-shadow: 0 0 8px currentColor; }
  .trofeo-glow { filter: drop-shadow(0 0 18px rgba(255,215,0,0.55)); }
  .estrellas-hero { color:#5CBF4A; text-shadow: 0 0 10px rgba(92,191,74,0.7); }

  .barra-fondo { background: rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; }
  .barra-fill { height:100%; border-radius:999px; background: linear-gradient(90deg,#3E9B33,#8DE87A); transition: width .6s ease; }

  @keyframes fadeInUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  .fade-in-up { animation: fadeInUp .5s ease both; }

  @keyframes expandDown { from { opacity:0; transform: scaleY(0.95); } to { opacity:1; transform: scaleY(1); } }
  .expand-down { animation: expandDown .25s ease-out both; transform-origin: top; }

  @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 12px 0 rgba(255,215,0,0.25); } 50% { box-shadow: 0 0 22px 4px rgba(255,215,0,0.5); } }
  .pulse-glow { animation: pulseGlow 2.4s ease-in-out infinite; }

  .tab-btn { transition: all .2s ease; }
  .tab-btn.activo { background: linear-gradient(90deg,#4CAF3F,#7DDC6A); color:#0B140C; box-shadow: 0 0 16px rgba(92,191,74,0.45); }
  .fila-jugador { transition: background-color .2s ease, transform .15s ease; }
  .fila-jugador:hover { background-color: rgba(255,255,255,0.06); }

  /* ===== Coronas / perfil / salón de la fama ===== */
  .corona { filter: drop-shadow(0 0 6px rgba(255,215,0,0.75)); }
  .modal-overlay { position:fixed; top:0; right:0; bottom:0; left:0; z-index:50; background:rgba(6,10,7,0.8); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display:flex; align-items:flex-end; justify-content:center; }
  .modal-card { width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:24px 24px 0 0; background: linear-gradient(180deg,#1A221B,#121813); color:#EEF3EE; border:1px solid rgba(140,230,120,0.18); animation: fadeInUp .3s ease both; }
  @media (min-width:640px) {
    .modal-overlay { align-items:center; }
    .modal-card { border-radius:24px; }
  }
  .foto-perfil { width:104px; height:104px; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); object-fit:cover; background:#232B25; }
  .ficha { position:absolute; transform: translate(-50%, -50%); display:flex; flex-direction:column; align-items:center; touch-action:none; user-select:none; -webkit-user-select:none; z-index:2; }
  .ficha-foto { width:46px; height:46px; border-radius:50%; object-fit:cover; background:#232B25; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
  .ficha-nombre { margin-top:2px; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.9); max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ficha.sel .ficha-foto { box-shadow:0 0 0 4px rgba(255,215,0,0.9), 0 2px 8px rgba(0,0,0,0.6); }
  .ficha.editable { cursor:grab; }
  .trofeo-chip { background: rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.3); }
</style>

// Convierte un link de Google Drive (de "compartir") a un link de imagen directa.
// Los links de Drive normales devuelven una página HTML, no la imagen en sí,
// por eso no cargan en un <img>. Si detecta un link de Drive, lo convierte;
// si no, devuelve la URL tal cual (para links de Imgur, etc. que ya son directos).
function convertirLinkFoto(url) {
  if (!url) return url;
  if (url.startsWith("data:")) return url;
  const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  if (m && m[1]) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  return url;
}

// ============ HELPERS ============
function calcularEstadisticas(j) {
  const pj = j.pj || 0;
  const puntos = j.puntos || 0;
  const promedio = pj > 0 ? (puntos / pj) : 0;
  return { ...j, pj, promedio };
}

function ordenarTabla(jugadores) {
  return [...jugadores]
    .map(calcularEstadisticas)
    .sort((a, b) => {
      if (b.promedio !== a.promedio) return b.promedio - a.promedio;
      if ((b.puntos||0) !== (a.puntos||0)) return (b.puntos||0) - (a.puntos||0);
      return (b.pj||0) - (a.pj||0);
    });
}

// ============ TEMPORADAS / PREMIOS ============
const PREMIOS_META = {
  campeon: { icono: "👑", nombre: "Campeón" },
  goleador: { icono: "⚽", nombre: "Goleador" },
  mejor_arquero: { icono: "🧤", nombre: "Mejor arquero" },
  equipo_ideal: { icono: "⭐", nombre: "Equipo ideal" }
};
const ORDEN_PREMIOS = ["campeon", "goleador", "mejor_arquero", "equipo_ideal"];

// Calcula los premios con la tabla actual.
// - Campeón: el puntero de la tabla.
// - Goleador: el que más goles hizo (si hay empate, lo comparten).
// - Mejor arquero y Equipo ideal (1 arquero + 4 de campo): salen por promedio,
//   pero solo entre quienes jugaron al menos la mitad de los partidos del que más jugó.
function calcularPremios(jugadores) {
  const tabla = ordenarTabla(jugadores).filter(j => j.pj > 0);
  if (tabla.length === 0) return [];
  const minPJ = Math.max(1, Math.ceil(Math.max(...tabla.map(j => j.pj)) * 0.5));
  const elegibles = tabla.filter(j => j.pj >= minPJ);
  const premios = [];
  const dar = (tipo, j) => premios.push({ tipo, jugadorId: j.id, nombre: j.nombre, foto: j.foto || "" });

  dar("campeon", tabla[0]);

  const maxGoles = Math.max(...tabla.map(j => j.goles || 0));
  if (maxGoles > 0) tabla.filter(j => (j.goles || 0) === maxGoles).forEach(j => dar("goleador", j));

  const arquero = elegibles.find(j => j.arquero);
  if (arquero) dar("mejor_arquero", arquero);

  const campo = elegibles.filter(j => !j.arquero).slice(0, arquero ? 4 : 5);
  (arquero ? [arquero, ...campo] : campo).forEach(j => dar("equipo_ideal", j));

  return premios;
}

// { jugadorId: cantidad de coronas (temporadas ganadas) }
function contarCoronas(temporadas) {
  const mapa = {};
  temporadas.forEach(t => (t.premios || []).forEach(p => {
    if (p.tipo === "campeon") mapa[p.jugadorId] = (mapa[p.jugadorId] || 0) + 1;
  }));
  return mapa;
}

// Todos los premios de un jugador, en el orden en que vienen las temporadas.
function premiosDeJugador(id, temporadas) {
  const lista = [];
  temporadas.forEach(t => (t.premios || []).forEach(p => {
    if (p.jugadorId === id) lista.push({ temporada: t.nombre, tipo: p.tipo });
  }));
  return lista;
}

function Coronas({ n }) {
  if (!n || n <= 0) return null;
  return (
    <span className="corona ml-1" title={n + (n === 1 ? " corona" : " coronas")}>
      👑{n > 1 && <span className="text-xs font-bold text-[#FFD700]">×{n}</span>}
    </span>
  );
}

// Sortea dos equipos balanceados según calidad. Si hay 2+ arqueros, reparte
// uno de cada lado. Si hay 0 o 1 arquero, ese arquero cuenta como 4 estrellas
// para el sorteo (su calidad real no se usa para balancear).
function armarEquipos(disponibles) {
  const arqueros = disponibles.filter(j => j.arquero);
  const campo = disponibles.filter(j => !j.arquero);
  let equipoA = [], equipoB = [], sumaA = 0, sumaB = 0;

  if (arqueros.length >= 2) {
    const arqOrdenados = [...arqueros].sort((a, b) => b.calidad - a.calidad);
    arqOrdenados.forEach((j, i) => {
      if (i % 2 === 0) { equipoA.push(j); sumaA += j.calidad; }
      else { equipoB.push(j); sumaB += j.calidad; }
    });
    const resto = [...campo].sort((a, b) => b.calidad - a.calidad);
    resto.forEach(j => {
      if (sumaA <= sumaB) { equipoA.push(j); sumaA += j.calidad; }
      else { equipoB.push(j); sumaB += j.calidad; }
    });
  } else {
    const todos = disponibles
      .map(j => ({ ...j, valorDraft: j.arquero ? 4 : j.calidad }))
      .sort((a, b) => b.valorDraft - a.valorDraft);
    todos.forEach(j => {
      if (sumaA <= sumaB) { equipoA.push(j); sumaA += j.valorDraft; }
      else { equipoB.push(j); sumaB += j.valorDraft; }
    });
  }
  return { equipoA, equipoB };
}

function Estrellas({ n, onClick }) {
  return (
    <span className="text-yellow-500 text-xl select-none">
      {Array.from({ length: 5 }).map((_, i) => (
        <span
          key={i}
          onClick={() => onClick && onClick(i + 1)}
          style={{ cursor: onClick ? "pointer" : "default" }}
        >
          {i < n ? "★" : "☆"}
        </span>
      ))}
    </span>
  );
}

function Cuadritos({ ultimos = [] }) {
  const colores = { V: "#22c55e", E: "#eab308", D: "#ef4444" };
  const slots = [...ultimos].slice(0, 5);
  while (slots.length < 5) slots.push(null);
  return (
    <div className="flex">
      {slots.map((r, i) => (
        <span
          key={i}
          className="cuadrito"
          style={{ background: r ? colores[r] : "#d1d5db" }}
          title={r === "V" ? "Ganado" : r === "E" ? "Empatado" : r === "D" ? "Perdido" : "—"}
        ></span>
      ))}
    </div>
  );
}

// ============ IMAGEN DE PREMIOS DE LA TEMPORADA ============
function cargarImagen(src) {
  return new Promise(resolve => {
    if (!src) return resolve(null);
    const img = new Image();
    if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
    const timer = setTimeout(() => resolve(null), 8000);
    img.onload = () => { clearTimeout(timer); resolve(img); };
    img.onerror = () => { clearTimeout(timer); resolve(null); };
    img.src = src;
  });
}

function dibujarTexto(ctx, txt, x, y, size, color, bold = true, maxW = 940) {
  ctx.font = (bold ? "bold " : "") + size + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(txt, x, y, maxW);
}

// Foto redonda con aro de color. Si la foto no cargó, dibuja la inicial.
function trazoHex(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 3 * k;
    const px = cx + r * 1.08 * Math.cos(a), py = cy + r * 1.08 * Math.sin(a);
    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function dibujarAvatar(ctx, img, nombre, cx, cy, r, aro) {
  ctx.save();
  ctx.shadowColor = aro;
  ctx.shadowBlur = 30;
  trazoHex(ctx, cx, cy, r + 9);
  ctx.fillStyle = aro;
  ctx.fill();
  ctx.restore();

  ctx.save();
  trazoHex(ctx, cx, cy, r);
  ctx.clip();
  if (img) {
    const lado = Math.min(img.width, img.height);
    const sx = (img.width - lado) / 2;
    const sy = (img.height - lado) * 0.25;
    ctx.drawImage(img, sx, sy, lado, lado, cx - r, cy - r, r * 2, r * 2);
  } else {
    ctx.fillStyle = "#232B25";
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    dibujarTexto(ctx, (nombre || "?").charAt(0).toUpperCase(), cx, cy, r, "#E8EEFC");
  }
  ctx.restore();
}

// Arma la imagen (1080x1700) con campeón, goleador, mejor arquero y equipo ideal.
async function generarImagenTemporada(t) {
  const W = 1080, H = 1700;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const premios = t.premios || [];
  const de = (tipo) => premios.filter(p => p.tipo === tipo);
  const stat = (id) => (t.tabla || []).find(x => x.id === id) || {};

  const ids = [...new Set(premios.map(p => p.jugadorId))];
  const imgs = {};
  await Promise.all(ids.map(async id => {
    const p = premios.find(x => x.jugadorId === id);
    imgs[id] = await cargarImagen(p.foto);
  }));

  // fondo
  const fondo = ctx.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, "#0C100D");
  fondo.addColorStop(0.5, "#121813");
  fondo.addColorStop(1, "#171E18");
  ctx.fillStyle = fondo;
  ctx.fillRect(0, 0, W, H);
  const brilloOro = ctx.createRadialGradient(W * 0.85, 0, 0, W * 0.85, 0, 650);
  brilloOro.addColorStop(0, "rgba(255,215,0,0.14)");
  brilloOro.addColorStop(1, "rgba(255,215,0,0)");
  ctx.fillStyle = brilloOro;
  ctx.fillRect(0, 0, W, H);
  const brilloCeleste = ctx.createRadialGradient(W * 0.15, 0, 0, W * 0.15, 0, 650);
  brilloCeleste.addColorStop(0, "rgba(92,191,74,0.26)");
  brilloCeleste.addColorStop(1, "rgba(92,191,74,0)");
  ctx.fillStyle = brilloCeleste;
  ctx.fillRect(0, 0, W, H);
  // trama de hexágonos tenue
  ctx.save();
  ctx.strokeStyle = "rgba(92,191,74,0.07)";
  ctx.lineWidth = 2;
  const HR = 60;
  for (let row = -1; row < H / (HR * 0.87) + 1; row++) {
    for (let col = -1; col < W / (HR * 1.5) + 1; col++) {
      const hx = col * HR * 1.5, hy = row * HR * 1.732 + (col % 2 ? HR * 0.866 : 0);
      ctx.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; const px = hx + HR * Math.cos(a), py = hy + HR * Math.sin(a); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(92,191,74,0.55)";
  ctx.lineWidth = 4;
  ctx.strokeRect(30, 30, W - 60, H - 60);

  // encabezado
  const logo = await cargarImagen(LOGO_EMU);
  if (logo) {
    const ph = 96, pw = Math.round(logo.width * (ph - 24) / logo.height) + 48;
    const x0 = (W - pw) / 2, y0 = 58, r = 18;
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0);
    ctx.arcTo(x0 + pw, y0, x0 + pw, y0 + ph, r);
    ctx.arcTo(x0 + pw, y0 + ph, x0, y0 + ph, r);
    ctx.arcTo(x0, y0 + ph, x0, y0, r);
    ctx.arcTo(x0, y0, x0 + pw, y0, r);
    ctx.closePath();
    ctx.fill();
    ctx.drawImage(logo, x0 + 24, y0 + 12, pw - 48, ph - 24);
  } else {
    dibujarTexto(ctx, "🏆", W / 2, 110, 90, "#FFD700");
  }
  const gradTitulo = ctx.createLinearGradient(W / 2 - 420, 0, W / 2 + 420, 0);
  gradTitulo.addColorStop(0, "#8DE87A");
  gradTitulo.addColorStop(0.5, "#FFFFFF");
  gradTitulo.addColorStop(1, "#8DE87A");
  dibujarTexto(ctx, "LA BANDA DEL TURNO TARDE", W / 2, 215, 54, gradTitulo);
  dibujarTexto(ctx, t.nombre || "Temporada", W / 2, 272, 42, "#E8EEFC");
  if (t.cerradaEn) {
    const f = new Date(t.cerradaEn).toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
    dibujarTexto(ctx, f, W / 2, 322, 26, "#94A3B8", false);
  }

  // campeón
  const camp = de("campeon")[0];
  if (camp) {
    dibujarTexto(ctx, "👑", W / 2, 415, 80, "#FFD700");
    dibujarAvatar(ctx, imgs[camp.jugadorId], camp.nombre, W / 2, 620, 150, "#FFD700");
    dibujarTexto(ctx, "CAMPEÓN", W / 2, 832, 38, "#FFD700");
    dibujarTexto(ctx, camp.nombre, W / 2, 895, 68, "#FFFFFF", true, 900);
    const sc = stat(camp.jugadorId);
    if (sc.promedio != null) {
      dibujarTexto(ctx, Number(sc.promedio).toFixed(2) + " pts/partido · " + (sc.pj || 0) + " PJ", W / 2, 952, 30, "#94A3B8", false);
    }
  }

  // goleador y mejor arquero
  const bloques = [];
  const gol = de("goleador");
  if (gol.length) {
    const g = stat(gol[0].jugadorId).goles || 0;
    bloques.push({ label: "⚽ GOLEADOR", ps: gol, texto: g + (g === 1 ? " gol" : " goles") });
  }
  const arq = de("mejor_arquero");
  if (arq.length) {
    const pr = stat(arq[0].jugadorId).promedio || 0;
    bloques.push({ label: "🧤 MEJOR ARQUERO", ps: arq, texto: Number(pr).toFixed(2) + " pts/partido" });
  }
  const xs = bloques.length === 1 ? [W / 2] : [W * 0.27, W * 0.73];
  bloques.forEach((b, i) => {
    const x = xs[i];
    dibujarTexto(ctx, b.label, x, 1020, 34, "#8DE87A", true, 440);
    dibujarAvatar(ctx, imgs[b.ps[0].jugadorId], b.ps[0].nombre, x, 1150, 85, "#5CBF4A");
    dibujarTexto(ctx, b.ps.map(p => p.nombre).join(" / "), x, 1290, 44, "#FFFFFF", true, 440);
    dibujarTexto(ctx, b.texto, x, 1335, 28, "#94A3B8", false, 440);
  });

  // equipo ideal
  const eq = de("equipo_ideal");
  if (eq.length) {
    dibujarTexto(ctx, "⭐ EQUIPO IDEAL", W / 2, 1405, 36, "#FFD700");
    const sep = 190;
    const x0 = W / 2 - ((eq.length - 1) * sep) / 2;
    eq.forEach((p, i) => {
      const x = x0 + i * sep;
      dibujarAvatar(ctx, imgs[p.jugadorId], p.nombre, x, 1520, 65, "#FFD700");
      dibujarTexto(ctx, p.nombre + (stat(p.jugadorId).arquero ? " 🧤" : ""), x, 1625, 26, "#E8EEFC", true, 175);
    });
  }

  return canvas;
}

// Ventana con la imagen lista para compartir o descargar
function ImagenTemporada({ temporada, cerrada, onClose }) {
  const [url, setUrl] = useState(null);
  const [blob, setBlob] = useState(null);
  const [error, setError] = useState("");
  const nombreArchivo = "premios-" + (temporada.nombre || "temporada").replace(/[^a-zA-Z0-9]+/g, "-") + ".png";

  useEffect(() => {
    let creada = null;
    let cancelado = false;
    generarImagenTemporada(temporada)
      .then(canvas => new Promise((ok, fail) =>
        canvas.toBlob(b => b ? ok(b) : fail(new Error("no se pudo generar la imagen")), "image/png")))
      .then(b => {
        if (cancelado) return;
        creada = URL.createObjectURL(b);
        setBlob(b);
        setUrl(creada);
      })
      .catch(e => { if (!cancelado) setError(e.message); });
    return () => { cancelado = true; if (creada) URL.revokeObjectURL(creada); };
  }, []);

  const compartir = async () => {
    const file = new File([blob], nombreArchivo, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: temporada.nombre }); } catch (e) {}
    } else {
      alert("Este navegador no deja compartir directo. Usá Descargar.");
    }
  };

  const descargar = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card p-5" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-extrabold text-lg">{cerrada ? "🏁 ¡Terminó " + temporada.nombre + "!" : "🏆 " + temporada.nombre}</h2>
          <button className="text-zinc-400 text-2xl leading-none px-2" onClick={onClose} aria-label="Cerrar">✕</button>
        </div>
        {!url && !error && <p className="text-zinc-400 text-sm py-10 text-center">Armando la imagen…</p>}
        {error && <p className="text-red-400 text-sm py-6 text-center">No se pudo armar la imagen: {error}</p>}
        {url && <img src={url} alt="Premios de la temporada" className="w-full rounded-xl mb-3" />}
        {url && (
          <div className="grid grid-cols-2 gap-2">
            <button className="bg-[#FFD700] text-[#06131F] rounded-xl py-3 font-bold" onClick={compartir}>📤 Compartir</button>
            <button className="bg-[#5CBF4A] text-[#0B140C] rounded-xl py-3 font-bold" onClick={descargar}>⬇️ Descargar</button>
          </div>
        )}
      </div>
    </div>
  );
}

function PerfilJugador({ j, posicion, coronas, premios, onClose, esAdmin, partidos = [], jugadores = [] }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

// Toma la foto elegida del celular, la recorta cuadrada y la achica a 256x256 JPEG
// (~10-15 KB) para guardarla como texto en la base de datos, sin Firebase Storage.
function comprimirFoto(file, lado = 256) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("no se pudo leer el archivo"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("el archivo no es una imagen válida"));
      img.onload = () => {
        const lado0 = Math.min(img.width, img.height);
        const sx = (img.width - lado0) / 2;
        const sy = (img.height - lado0) * 0.25;
        const canvas = document.createElement("canvas");
        canvas.width = lado;
        canvas.height = lado;
        canvas.getContext("2d").drawImage(img, sx, sy, lado0, lado0, 0, 0, lado, lado);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ============ CANCHA (armado manual) ============
// fichas: [{ id, nombre, foto, x, y, equipo }]  (x, y en % de la cancha)
// Mitad de arriba = Equipo A, mitad de abajo = Equipo B.
function Cancha({ fichas, editable, selId, onSelect, onMove, onTapCancha }) {
  const ref = useRef(null);
  const drag = useRef(null);

  const posDe = (e) => {
    const r = ref.current.getBoundingClientRect();
    return {
      x: Math.min(94, Math.max(6, ((e.clientX - r.left) / r.width) * 100)),
      y: Math.min(95, Math.max(5, ((e.clientY - r.top) / r.height) * 100))
    };
  };

  return (
    <div className="w-full mx-auto" style={{ maxWidth: 420 }}>
    <div
      ref={ref}
      className="relative w-full rounded-xl overflow-hidden select-none"
      style={{ paddingTop: "150%", background: "#2f8f4e", touchAction: editable ? "pan-y" : "auto" }}
      onClick={(e) => { if (editable && onTapCancha) onTapCancha(posDe(e)); }}
    >
      <svg viewBox="0 0 100 150" className="absolute w-full h-full" style={{ top: 0, left: 0, pointerEvents: "none" }}>
        {Array.from({ length: 10 }).map((_, i) => (
          <rect key={i} x="0" y={i * 15} width="100" height="15" fill={i % 2 ? "#2f8f4e" : "#35a057"} />
        ))}
        <g fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="0.6">
          <rect x="3" y="3" width="94" height="144" />
          <line x1="3" y1="75" x2="97" y2="75" />
          <circle cx="50" cy="75" r="12" />
          <rect x="25" y="3" width="50" height="22" />
          <rect x="38" y="3" width="24" height="8" />
          <path d="M 41.06 25 A 12 12 0 0 0 58.94 25" />
          <rect x="25" y="125" width="50" height="22" />
          <rect x="38" y="139" width="24" height="8" />
          <path d="M 41.06 125 A 12 12 0 0 1 58.94 125" />
        </g>
        <g fill="rgba(255,255,255,0.9)">
          <circle cx="50" cy="75" r="0.9" />
          <circle cx="50" cy="17" r="0.9" />
          <circle cx="50" cy="133" r="0.9" />
        </g>
      </svg>

      <span className="absolute text-[11px] font-extrabold tracking-widest" style={{ top: 8, left: 10, color: "rgba(255,255,255,0.75)" }}>EQUIPO A</span>
      <span className="absolute text-[11px] font-extrabold tracking-widest" style={{ bottom: 8, left: 10, color: "rgba(255,255,255,0.75)" }}>EQUIPO B</span>

      {fichas.map(f => (
        <div
          key={f.id}
          className={"ficha" + (editable ? " editable" : "") + (selId === f.id ? " sel" : "")}
          style={{ left: f.x + "%", top: f.y + "%" }}
          onClick={(e) => e.stopPropagation()}
          onPointerDown={(e) => {
            if (!editable) return;
            e.stopPropagation();
            e.currentTarget.setPointerCapture(e.pointerId);
            drag.current = { id: f.id, sx: e.clientX, sy: e.clientY, moved: false };
          }}
          onPointerMove={(e) => {
            const d = drag.current;
            if (!d || d.id !== f.id) return;
            if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
            d.moved = true;
            onMove(f.id, posDe(e));
          }}
          onPointerUp={() => {
            const d = drag.current;
            drag.current = null;
            if (d && !d.moved && onSelect) onSelect(f.id);
          }}
          onPointerCancel={() => { drag.current = null; }}
        >
          {f.foto
            ? <img src={f.foto} alt={f.nombre} className="ficha-foto" draggable="false"
                style={{ borderColor: f.equipo === "A" ? "#3b82f6" : "#ef4444" }} />
            : <div className="ficha-foto" style={{ borderColor: f.equipo === "A" ? "#3b82f6" : "#ef4444" }}>
                {(f.nombre || "?").charAt(0).toUpperCase()}
              </div>}
          <span className="ficha-nombre">{f.nombre}{f.arquero ? " 🧤" : ""}</span>
        </div>
      ))}
    </div>
    </div>
  );
}

// Vista de solo lectura de un partido armado a mano
function fichasDePartido(partido, jugadores) {
  const pos = partido.posiciones || {};
  return Object.keys(pos).map(id => {
    const j = jugadores.find(x => x.id === id);
    if (!j) return null;
    return {
      id, nombre: j.nombre, foto: j.foto, arquero: j.arquero,
      x: pos[id].x, y: pos[id].y,
      equipo: (partido.equipoA || []).includes(id) ? "A" : "B"
    };
  }).filter(Boolean);
}

// ============ EDICIÓN DE PARTIDOS (cambios de último momento) ============
// Idea: cada jugador aporta a la tabla según el equipo en el que estuvo y el resultado.
// Al editar una fecha ya cargada se RESTA lo que había aportado y se SUMA lo nuevo.
const PUNTOS_TIPO = { V: 3, E: 1, D: 0 };

function tipoDe(resultado, lado) {
  if (resultado === "E") return "E";
  return resultado === lado ? "V" : "D";
}

function ladoEn(partido, id) {
  if ((partido.equipoA || []).includes(id)) return "A";
  if ((partido.equipoB || []).includes(id)) return "B";
  return null;
}

// Entrada del historial del jugador que corresponde a este partido
// (los partidos cargados antes de esta versión no tienen partidoId: se busca por fecha y resultado)
function indiceHistorial(historial, partido, tipo) {
  let i = historial.findIndex(h => h.partidoId === partido.id);
  if (i === -1) i = historial.findIndex(h => !h.partidoId && h.fecha === partido.fecha && h.resultado === tipo);
  return i;
}

function golesEnPartido(partido, j) {
  const lado = ladoEn(partido, j.id);
  if (lado && partido.finalizado) {
    const h = j.historial || [];
    const i = indiceHistorial(h, partido, tipoDe(partido.resultado, lado));
    if (i !== -1) return h[i].goles || 0;
  }
  return (partido.goles && partido.goles[j.id]) || 0;
}

function posInicial(lado, cantidad) {
  const xs = [20, 50, 80, 35, 65];
  return { x: xs[cantidad % xs.length], y: lado === "A" ? 18 + (cantidad % 2) * 14 : 82 - (cantidad % 2) * 14 };
}

function espejarPos(pos, ladoNuevo) {
  const y = 100 - pos.y;
  return { x: pos.x, y: ladoNuevo === "A" ? Math.min(y, 45) : Math.max(y, 55) };
}

// Devuelve { updates, resumen }: updates es un objeto de rutas de Firebase para aplicar de una sola vez
// (equipos nuevos + ajuste de estadísticas), y resumen una lista de frases para confirmar con el admin.
function calcularCambiosPartido(partido, A2, B2, goles2, pos2, jugadores) {
  const updates = {};
  const resumen = [];
  const base = "partidos/" + partido.id + "/";
  updates[base + "equipoA"] = A2;
  updates[base + "equipoB"] = B2;
  updates[base + "disponibles"] = [...A2, ...B2];
  if (pos2) {
    const limpia = {};
    [...A2, ...B2].forEach(id => { if (pos2[id]) limpia[id] = pos2[id]; });
    updates[base + "posiciones"] = limpia;
  }
  if (!partido.finalizado) return { updates, resumen };

  const todos = [...new Set([...(partido.equipoA || []), ...(partido.equipoB || []), ...A2, ...B2])];
  const golesFinal = {};

  todos.forEach(id => {
    const j = jugadores.find(x => x.id === id);
    if (!j) return;
    const ladoViejo = ladoEn(partido, id);
    const ladoNuevo = A2.includes(id) ? "A" : B2.includes(id) ? "B" : null;
    const tipoViejo = ladoViejo ? tipoDe(partido.resultado, ladoViejo) : null;
    const tipoNuevo = ladoNuevo ? tipoDe(partido.resultado, ladoNuevo) : null;
    const golViejo = ladoViejo ? golesEnPartido(partido, j) : 0;
    const golNuevo = !ladoNuevo ? 0 : (goles2 && goles2[id] !== undefined ? goles2[id] : golViejo);
    if (ladoNuevo) golesFinal[id] = golNuevo;
    if (tipoViejo === tipoNuevo && golViejo === golNuevo) return; // este jugador no cambia nada

    let pj = j.pj || 0, pg = j.pg || 0, pe = j.pe || 0, pp = j.pp || 0, puntos = j.puntos || 0, goles = j.goles || 0;
    const h = [...(j.historial || [])];
    let idx = -1;
    const campo = { V: "pg", E: "pe", D: "pp" };
    const sumar = (tipo, signo) => {
      pj += signo;
      if (tipo === "V") pg += signo; else if (tipo === "E") pe += signo; else pp += signo;
      puntos += signo * PUNTOS_TIPO[tipo];
    };

    if (tipoViejo) { idx = indiceHistorial(h, partido, tipoViejo); sumar(tipoViejo, -1); goles -= golViejo; }
    if (tipoNuevo) {
      sumar(tipoNuevo, +1); goles += golNuevo;
      const entrada = { fecha: partido.fecha, resultado: tipoNuevo, goles: golNuevo, partidoId: partido.id };
      if (idx !== -1) h[idx] = entrada; else h.push(entrada);
    } else if (idx !== -1) {
      h.splice(idx, 1);
    }

    const jb = "jugadores/" + id + "/";
    updates[jb + "pj"] = Math.max(0, pj);
    updates[jb + "pg"] = Math.max(0, pg);
    updates[jb + "pe"] = Math.max(0, pe);
    updates[jb + "pp"] = Math.max(0, pp);
    updates[jb + "puntos"] = Math.max(0, puntos);
    updates[jb + "goles"] = Math.max(0, goles);
    updates[jb + "historial"] = h.length ? h : null;
    const orden = h.map((x, i) => ({ ...x, i })).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || b.i - a.i);
    const ult = orden.slice(0, 5).map(x => x.resultado);
    updates[jb + "ultimos"] = ult.length ? ult : null;

    if (tipoViejo && !tipoNuevo) {
      resumen.push("➖ " + j.nombre + ": sale de la fecha (se le restan " + PUNTOS_TIPO[tipoViejo] + " pts" + (golViejo ? " y " + golViejo + " gol(es)" : "") + ")");
    } else if (!tipoViejo && tipoNuevo) {
      resumen.push("➕ " + j.nombre + ": entra al Equipo " + ladoNuevo + " (suma " + PUNTOS_TIPO[tipoNuevo] + " pts" + (golNuevo ? " y " + golNuevo + " gol(es)" : "") + ")");
    } else if (tipoViejo !== tipoNuevo) {
      resumen.push("🔁 " + j.nombre + ": pasa al Equipo " + ladoNuevo + " (de " + PUNTOS_TIPO[tipoViejo] + " a " + PUNTOS_TIPO[tipoNuevo] + " pts)");
    } else {
      resumen.push("⚽ " + j.nombre + ": cambian sus goles (" + golViejo + " → " + golNuevo + ")");
    }
  });

  updates[base + "goles"] = golesFinal;
  return { updates, resumen };
}

// Editor de los equipos de una fecha (pendiente o ya jugada)
function EditorPartido({ partido, jugadores, onClose }) {
  const [A, setA] = useState(partido.equipoA || []);
  const [B, setB] = useState(partido.equipoB || []);
  const [pos, setPos] = useState(partido.posiciones || null);
  const [goles, setGoles] = useState(() => {
    const m = {};
    if (partido.finalizado) {
      [...(partido.equipoA || []), ...(partido.equipoB || [])].forEach(id => {
        const j = jugadores.find(x => x.id === id);
        m[id] = j ? golesEnPartido(partido, j) : 0;
      });
    }
    return m;
  });
  const [filtro, setFiltro] = useState("");
  const [guardando, setGuardando] = useState(false);

  const jug = (id) => jugadores.find(j => j.id === id) || { id, nombre: "?" };

  const mover = (id) => {
    const deA = A.includes(id);
    setA(a => deA ? a.filter(x => x !== id) : [...a, id]);
    setB(b => deA ? [...b, id] : b.filter(x => x !== id));
    if (pos && pos[id]) setPos(p => ({ ...p, [id]: espejarPos(p[id], deA ? "B" : "A") }));
  };
  const sacar = (id) => {
    setA(a => a.filter(x => x !== id));
    setB(b => b.filter(x => x !== id));
    if (pos) setPos(p => { const c = { ...p }; delete c[id]; return c; });
    setGoles(g => { const c = { ...g }; delete c[id]; return c; });
  };
  const agregar = (id, lado) => {
    if (lado === "A") setA(a => [...a, id]); else setB(b => [...b, id]);
    if (pos) setPos(p => ({ ...p, [id]: posInicial(lado, (lado === "A" ? A : B).length) }));
    if (partido.finalizado) setGoles(g => ({ ...g, [id]: 0 }));
  };
  // arrastrar en la cancha: la mitad define el equipo
  const moverEnCancha = (id, nueva) => {
    setPos(p => ({ ...p, [id]: nueva }));
    const lado = nueva.y < 50 ? "A" : "B";
    setA(a => lado === "A" ? (a.includes(id) ? a : [...a, id]) : a.filter(x => x !== id));
    setB(b => lado === "B" ? (b.includes(id) ? b : [...b, id]) : b.filter(x => x !== id));
  };

  const guardar = () => {
    if (A.length === 0 || B.length === 0) return alert("Cada equipo necesita al menos un jugador");
    const { updates, resumen } = calcularCambiosPartido(partido, A, B, goles, pos, jugadores);
    if (partido.finalizado && resumen.length > 0) {
      if (!confirm("Esta fecha ya tiene resultado. Se van a ajustar las estadísticas:\n\n" + resumen.join("\n") + "\n\n¿Confirmar?")) return;
    }
    setGuardando(true);
    db.ref().update(updates)
      .then(() => { onClose(); alert("Equipos actualizados" + (resumen.length ? " y estadísticas ajustadas ✅" : " ✅")); })
      .catch(err => { setGuardando(false); alert("No se pudo guardar: " + err.message); });
  };

  const fuera = jugadores.filter(j =>
    !A.includes(j.id) && !B.includes(j.id) &&
    j.nombre.toLowerCase().includes(filtro.trim().toLowerCase())
  );
  const fichas = pos ? Object.keys(pos)
    .filter(id => A.includes(id) || B.includes(id))
    .map(id => ({
      id, nombre: jug(id).nombre, foto: jug(id).foto, arquero: jug(id).arquero,
      x: pos[id].x, y: pos[id].y, equipo: A.includes(id) ? "A" : "B"
    })) : [];

  return (
    <div className="bg-white rounded-2xl shadow p-3 border-2 border-yellow-400">
      <div className="flex items-center justify-between mb-2">
        <p className="font-bold">✏️ Editar equipos · {partido.fecha}</p>
        <button className="text-gray-500 text-sm underline" onClick={onClose}>Cancelar</button>
      </div>
      {partido.finalizado && (
        <p className="text-xs bg-yellow-50 border border-yellow-300 text-yellow-800 rounded-lg p-2 mb-2">
          Esta fecha ya tiene resultado. Al guardar, al que sale se le restan los puntos y goles de esta fecha, y al que entra se le suman. Podés corregir los goles de cada uno.
        </p>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
        {["A", "B"].map(lado => {
          const ids = lado === "A" ? A : B;
          return (
            <div key={lado} className={"rounded-lg p-2 " + (lado === "A" ? "bg-blue-50" : "bg-red-50")}>
              <p className={"font-bold mb-1 " + (lado === "A" ? "text-blue-700" : "text-red-700")}>Equipo {lado} ({ids.length})</p>
              {ids.map(id => (
                <div key={id} className="flex items-center gap-1 text-sm py-1">
                  <span className="flex-1 truncate">{jug(id).nombre}{jug(id).arquero ? " 🧤" : ""}</span>
                  {partido.finalizado && (
                    <label className="flex items-center gap-1 text-xs text-gray-500">⚽
                      <input type="number" min="0" className="border rounded w-12 p-1 text-center text-sm"
                        value={goles[id] || 0}
                        onChange={e => setGoles(g => ({ ...g, [id]: Math.max(0, parseInt(e.target.value || "0", 10) || 0) }))} />
                    </label>
                  )}
                  <button className="px-2 py-1 bg-white border rounded text-xs font-bold" onClick={() => mover(id)}>{lado === "A" ? "→ B" : "← A"}</button>
                  <button className="px-2 py-1 bg-white border rounded text-xs font-bold text-red-600" onClick={() => sacar(id)}>✕</button>
                </div>
              ))}
              {ids.length === 0 && <p className="text-xs text-gray-400">Sin jugadores</p>}
            </div>
          );
        })}
      </div>

      <p className="text-sm font-semibold mt-3 mb-1">Agregar jugador</p>
      <input className="border rounded-lg w-full p-2 mb-2 text-sm" placeholder="Buscar por nombre…"
        value={filtro} onChange={e => setFiltro(e.target.value)} />
      <div className="max-h-48 overflow-y-auto border rounded-lg divide-y">
        {fuera.map(j => (
          <div key={j.id} className="flex items-center gap-2 p-2 text-sm">
            <span className="flex-1">{j.nombre}{j.arquero ? " 🧤" : ""}</span>
            <button className="px-3 py-1 bg-blue-100 text-blue-800 rounded font-bold text-xs" onClick={() => agregar(j.id, "A")}>+ A</button>
            <button className="px-3 py-1 bg-red-100 text-red-800 rounded font-bold text-xs" onClick={() => agregar(j.id, "B")}>+ B</button>
          </div>
        ))}
        {fuera.length === 0 && <p className="p-2 text-sm text-gray-400">No hay más jugadores para agregar</p>}
      </div>

      {pos && (
        <div className="mt-3">
          <p className="text-sm font-semibold mb-1">Cancha (arrastrá para mover; arriba A, abajo B)</p>
          <Cancha fichas={fichas} editable onMove={moverEnCancha} />
        </div>
      )}

      <div className="flex gap-2 mt-3">
        <button className="bg-[#3E9B33] text-white rounded-lg px-4 py-2 font-bold disabled:opacity-50" disabled={guardando} onClick={guardar}>
          {guardando ? "Guardando…" : "Guardar cambios"}
        </button>
        <button className="bg-gray-300 rounded-lg px-4 py-2" onClick={onClose}>Cancelar</button>
      </div>
    </div>
  );
}

// Panel de admin dentro del perfil del jugador: asignarlo (o sacarlo) de una fecha
function AsignarFecha({ j, partidos, jugadores }) {
  const lista = [...partidos].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const [pid, setPid] = useState(lista[0] ? lista[0].id : "");
  const [gol, setGol] = useState(0);
  const p = lista.find(x => x.id === pid);
  const lado = p ? ladoEn(p, j.id) : null;

  useEffect(() => {
    const q = lista.find(x => x.id === pid);
    setGol(q && q.finalizado && ladoEn(q, j.id) ? golesEnPartido(q, j) : 0);
  }, [pid]);

  if (lista.length === 0) {
    return <p className="text-sm text-zinc-400 mt-4">No hay fechas cargadas para asignar.</p>;
  }

  const aplicar = (destino) => {
    if (!p) return;
    const A = (p.equipoA || []).filter(x => x !== j.id);
    const B = (p.equipoB || []).filter(x => x !== j.id);
    if (destino === "A") A.push(j.id);
    if (destino === "B") B.push(j.id);
    if (A.length === 0 || B.length === 0) return alert("Cada equipo necesita al menos un jugador");

    let pos = p.posiciones ? { ...p.posiciones } : null;
    if (pos) {
      if (!destino) delete pos[j.id];
      else if (pos[j.id] && lado && lado !== destino) pos[j.id] = espejarPos(pos[j.id], destino);
      else if (!pos[j.id]) pos[j.id] = posInicial(destino, (destino === "A" ? A : B).length - 1);
    }

    const { updates, resumen } = calcularCambiosPartido(p, A, B, p.finalizado && destino ? { [j.id]: gol } : null, pos, jugadores);
    if (p.finalizado) {
      if (resumen.length === 0 && lado === destino) return alert("No hay cambios para guardar");
      if (!confirm("Fecha " + p.fecha + " (ya tiene resultado). Se van a ajustar las estadísticas:\n\n" + (resumen.join("\n") || "Cambia de equipo, sin cambio de puntos") + "\n\n¿Confirmar?")) return;
    } else if (lado === destino) {
      return alert("Ya está en ese equipo");
    }
    db.ref().update(updates)
      .then(() => alert("Listo ✅"))
      .catch(err => alert("No se pudo guardar: " + err.message));
  };

  const estado = !p ? "" : lado ? "Está en el Equipo " + lado : "No jugó esta fecha";

  return (
    <div className="mt-5 rounded-xl p-3" style={{ background: "rgba(255,215,0,0.08)", border: "1px solid rgba(255,215,0,0.3)" }}>
      <h3 className="text-sm font-bold text-[#FFD700] mb-2">🛠️ Admin: asignar a una fecha</h3>
      <select className="w-full rounded-lg p-2 mb-2 text-[#06131F] bg-white" value={pid} onChange={e => setPid(e.target.value)}>
        {lista.map(x => (
          <option key={x.id} value={x.id}>{x.fecha} {x.finalizado ? "✅ jugada" : "⏳ pendiente"}</option>
        ))}
      </select>
      <p className="text-xs text-zinc-300 mb-2">{estado}</p>
      {p && p.finalizado && (
        <label className="flex items-center gap-2 text-sm mb-2">⚽ Goles en esa fecha
          <input type="number" min="0" className="rounded w-16 p-1 text-center text-[#06131F]" value={gol}
            onChange={e => setGol(Math.max(0, parseInt(e.target.value || "0", 10) || 0))} />
        </label>
      )}
      <div className="grid grid-cols-2 gap-2">
        <button className="rounded-lg py-2 font-bold bg-[#22D3EE] text-[#06131F]" onClick={() => aplicar("A")}>
          {lado === "A" ? "✔ Equipo A" : "Poner en Equipo A"}
        </button>
        <button className="rounded-lg py-2 font-bold bg-[#FFD700] text-[#06131F]" onClick={() => aplicar("B")}>
          {lado === "B" ? "✔ Equipo B" : "Poner en Equipo B"}
        </button>
      </div>
      {lado && (
        <button className="mt-2 w-full rounded-lg py-2 text-sm font-bold bg-white/10 text-red-300" onClick={() => aplicar(null)}>
          Sacar de esta fecha
        </button>
      )}
    </div>
  );
}

// ============ ADMIN: FECHAS Y SORTEO ============
function AdminFechas({ jugadores, partidos }) {
  const [fecha, setFecha] = useState("");
  const [seleccionados, setSeleccionados] = useState({});
  const [preview, setPreview] = useState(null);
  const [modo, setModo] = useState("sorteo"); // sorteo | manual
  const [posiciones, setPosiciones] = useState({}); // { jugadorId: { x, y } } en % de la cancha
  const [selPool, setSelPool] = useState(null);     // jugador elegido de la lista para ubicar
  const [selFicha, setSelFicha] = useState(null);   // ficha elegida en la cancha
  const [editandoId, setEditandoId] = useState(null);

  const toggle = (id) => setSeleccionados(s => ({ ...s, [id]: !s[id] }));

  const disponibles = jugadores.filter(j => seleccionados[j.id]);
  const sinUbicar = disponibles.filter(j => !posiciones[j.id]);
  const fichas = disponibles.filter(j => posiciones[j.id]).map(j => ({
    id: j.id, nombre: j.nombre, foto: j.foto, arquero: j.arquero,
    x: posiciones[j.id].x, y: posiciones[j.id].y,
    equipo: posiciones[j.id].y < 50 ? "A" : "B"
  }));
  const fichasA = fichas.filter(f => f.equipo === "A");
  const fichasB = fichas.filter(f => f.equipo === "B");
  const calidadDe = (lista) => lista.reduce((s, f) => s + ((jugadores.find(j => j.id === f.id) || {}).calidad || 0), 0);

  const moverFicha = (id, pos) => setPosiciones(p => ({ ...p, [id]: pos }));
  const tocarCancha = (pos) => {
    if (!selPool) return;
    setPosiciones(p => ({ ...p, [selPool]: pos }));
    setSelPool(null);
  };
  const sacarFicha = () => {
    if (!selFicha) return;
    setPosiciones(p => { const c = { ...p }; delete c[selFicha]; return c; });
    setSelFicha(null);
  };

  const sortear = () => {
    if (disponibles.length < 2) return alert("Seleccioná al menos 2 jugadores disponibles");
    setPreview(armarEquipos(disponibles));
  };

  const guardarManual = () => {
    if (fichasA.length === 0 || fichasB.length === 0) {
      return alert("Poné al menos un jugador en cada mitad de la cancha (arriba Equipo A, abajo Equipo B)");
    }
    if (sinUbicar.length > 0 && !confirm("Quedan " + sinUbicar.length + " jugador(es) sin ubicar. Se van a dejar afuera de esta fecha. ¿Seguir?")) return;
    const pos = {};
    fichas.forEach(f => { pos[f.id] = { x: Math.round(f.x * 10) / 10, y: Math.round(f.y * 10) / 10 }; });
    db.ref("partidos").push({
      fecha,
      disponibles: fichas.map(f => f.id),
      equipoA: fichasA.map(f => f.id),
      equipoB: fichasB.map(f => f.id),
      posiciones: pos,
      manual: true,
      resultado: null,
      finalizado: false
    });
    setFecha(""); setSeleccionados({}); setPosiciones({}); setSelPool(null); setSelFicha(null);
    alert("Fecha creada con el armado manual");
  };

  const guardarFecha = () => {
    if (!fecha) return alert("Elegí una fecha");
    if (modo === "manual") return guardarManual();
    if (!preview) return alert("Primero sorteá los equipos");
    db.ref("partidos").push({
      fecha,
      disponibles: disponibles.map(j => j.id),
      equipoA: preview.equipoA.map(j => j.id),
      equipoB: preview.equipoB.map(j => j.id),
      resultado: null,
      finalizado: false
    });
    setFecha(""); setSeleccionados({}); setPreview(null);
    alert("Fecha creada con los equipos sorteados");
  };

  const nombreDe = (id) => (jugadores.find(j => j.id === id) || {}).nombre || "?";

  return (
    <div>
      <div className="bg-white p-4 rounded-2xl shadow mb-4">
        <h3 className="font-bold mb-2">Nueva fecha</h3>
        <input type="date" className="border rounded-lg p-2 mb-3"
          value={fecha} onChange={e => setFecha(e.target.value)} />
        <p className="text-sm font-semibold mb-1">Jugadores disponibles:</p>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
          {jugadores.map(j => (
            <label key={j.id} className="flex items-center gap-2 text-sm bg-[#EEF4EC] rounded-lg p-2">
              <input type="checkbox" checked={!!seleccionados[j.id]} onChange={() => toggle(j.id)} />
              {j.nombre} {j.arquero && "🧤"}
            </label>
          ))}
        </div>
        <div className="flex gap-2 mb-3">
          {[["sorteo", "🎲 Sortear"], ["manual", "✋ Armar a mano"]].map(([k, label]) => (
            <button key={k}
              className={`px-3 py-2 rounded-lg text-sm font-bold ${modo === k ? "bg-[#3E9B33] text-white" : "bg-[#EEF4EC] text-[#1F4D1B]"}`}
              onClick={() => setModo(k)}>
              {label}
            </button>
          ))}
        </div>
        {modo === "sorteo" && (
          <button className="bg-[#3E9B33] text-white rounded-lg px-4 py-2 font-bold mr-2" onClick={sortear}>
            Sortear equipos
          </button>
        )}
        {modo === "sorteo" && preview && (
          <button className="bg-[#3E9B33] text-white rounded-lg px-4 py-2 font-bold" onClick={guardarFecha}>
            Guardar fecha
          </button>
        )}

        {modo === "sorteo" && preview && (
          <div className="grid grid-cols-2 gap-3 mt-4">
            <div className="bg-blue-50 rounded-lg p-3">
              <p className="font-bold text-blue-700 mb-1">Equipo A</p>
              {preview.equipoA.map(j => <p key={j.id} className="text-sm">{j.nombre} {j.arquero && "🧤"} <Estrellas n={j.calidad} /></p>)}
            </div>
            <div className="bg-red-50 rounded-lg p-3">
              <p className="font-bold text-red-700 mb-1">Equipo B</p>
              {preview.equipoB.map(j => <p key={j.id} className="text-sm">{j.nombre} {j.arquero && "🧤"} <Estrellas n={j.calidad} /></p>)}
            </div>
          </div>
        )}

        {modo === "manual" && (
          <div className="mt-2">
            {disponibles.length === 0 ? (
              <p className="text-sm text-gray-500">Marcá arriba los jugadores disponibles y después ubicalos en la cancha.</p>
            ) : (
              <>
                <p className="text-xs text-gray-500 mb-2">
                  1) Tocá un jugador de la lista. 2) Tocá la cancha donde lo querés. Después podés arrastrarlo. La mitad de arriba es el Equipo A y la de abajo el Equipo B.
                </p>

                <p className="text-sm font-semibold mb-1">Sin ubicar ({sinUbicar.length}):</p>
                <div className="flex flex-wrap gap-2 mb-3 min-h-[2rem]">
                  {sinUbicar.map(j => (
                    <button key={j.id}
                      className={`rounded-full px-3 py-1 text-sm font-bold border ${selPool === j.id ? "bg-[#FFD700] border-yellow-500 text-[#06131F]" : "bg-[#EEF4EC] border-[#3E9B33] text-[#1F4D1B]"}`}
                      onClick={() => { setSelFicha(null); setSelPool(selPool === j.id ? null : j.id); }}>
                      {j.nombre}{j.arquero ? " 🧤" : ""}
                    </button>
                  ))}
                  {sinUbicar.length === 0 && <span className="text-sm text-green-700">Todos ubicados ✅</span>}
                </div>

                {selPool && <p className="text-sm font-bold text-yellow-700 mb-2">👆 Tocá la cancha para ubicar a {(jugadores.find(j => j.id === selPool) || {}).nombre}</p>}

                <Cancha
                  fichas={fichas}
                  editable
                  selId={selFicha}
                  onSelect={(id) => { setSelPool(null); setSelFicha(selFicha === id ? null : id); }}
                  onMove={moverFicha}
                  onTapCancha={tocarCancha}
                />

                <div className="grid grid-cols-2 gap-2 mt-3 text-sm">
                  <div className="bg-blue-50 rounded-lg p-2 text-blue-800"><b>Equipo A:</b> {fichasA.length} jugadores · ★ {calidadDe(fichasA)}</div>
                  <div className="bg-red-50 rounded-lg p-2 text-red-800"><b>Equipo B:</b> {fichasB.length} jugadores · ★ {calidadDe(fichasB)}</div>
                </div>

                <div className="flex flex-wrap gap-2 mt-3">
                  <button className="bg-[#3E9B33] text-white rounded-lg px-4 py-2 font-bold" onClick={guardarFecha}>Guardar fecha</button>
                  {selFicha && (
                    <button className="bg-orange-500 text-white rounded-lg px-4 py-2 font-bold" onClick={sacarFicha}>Sacar de la cancha</button>
                  )}
                  {fichas.length > 0 && (
                    <button className="bg-gray-300 rounded-lg px-4 py-2"
                      onClick={() => { if (confirm("¿Sacar a todos de la cancha?")) { setPosiciones({}); setSelFicha(null); } }}>
                      Limpiar cancha
                    </button>
                  )}
                </div>
              </>
            )}
          </div>
        )}
      </div>

      <h3 className="font-bold mb-2">Fechas cargadas</h3>
      <div className="space-y-3">
        {partidos.slice().reverse().map(p => editandoId === p.id ? (
          <EditorPartido key={p.id} partido={p} jugadores={jugadores} onClose={() => setEditandoId(null)} />
        ) : (
          <div key={p.id} className="bg-white rounded-2xl shadow p-3">
            <div className="flex items-center justify-between gap-2">
              <p className="font-semibold">{p.fecha} {p.finalizado ? "✅ Finalizado" : "⏳ Pendiente"}</p>
              <button className="text-[#2E7D32] text-sm font-bold whitespace-nowrap" onClick={() => setEditandoId(p.id)}>✏️ Editar equipos</button>
            </div>
            <div className="grid grid-cols-2 gap-2 text-sm mt-2">
              <div><span className="font-bold text-blue-700">Equipo A:</span> {(p.equipoA || []).map(nombreDe).join(", ")}</div>
              <div><span className="font-bold text-red-700">Equipo B:</span> {(p.equipoB || []).map(nombreDe).join(", ")}</div>
            </div>
            <CanchaToggle partido={p} jugadores={jugadores} />
            {p.finalizado && (
              <p className="text-sm mt-1 text-gray-600">
                Resultado: {p.resultado === "A" ? "Ganó Equipo A" : p.resultado === "B" ? "Ganó Equipo B" : "Empate"}
              </p>
            )}
          </div>
        ))}
        {partidos.length === 0 && <p className="text-gray-400 text-center">No hay fechas cargadas</p>}
      </div>
    </div>
  );
}

// ============ ADMIN: RESULTADOS ============
function FilaGoles({ nombre, valor, onChange }) {
  return (
    <div className="flex items-center justify-between text-sm py-1">
      <span>{nombre}</span>
      <input
        type="number" min="0" className="border rounded-lg w-16 p-1 text-center"
        value={valor} onChange={e => onChange(parseInt(e.target.value || "0", 10))}
      />
    </div>
  );
}

function AdminResultados({ jugadores, partidos }) {
  const pendientes = partidos.filter(p => !p.finalizado);
  const [golesPorPartido, setGolesPorPartido] = useState({});
  const [editandoId, setEditandoId] = useState(null);

  const setGol = (partidoId, jugadorId, valor) => {
    setGolesPorPartido(g => ({
      ...g,
      [partidoId]: { ...(g[partidoId] || {}), [jugadorId]: valor }
    }));
  };

  const cargarResultado = (partido, resultado) => {
    // resultado: "A" (ganó A), "B" (ganó B), "E" (empate)
    if (!confirm("¿Confirmar este resultado? No se puede deshacer.")) return;

    const golesDeEsteMatch = golesPorPartido[partido.id] || {};

    const actualizar = (id, tipo) => {
      const j = jugadores.find(x => x.id === id);
      if (!j) return;
      const puntosGanados = tipo === "V" ? 3 : tipo === "E" ? 1 : 0;
      const golesEnEstePartido = golesDeEsteMatch[id] || 0;
      const nuevos = {
        pj: (j.pj || 0) + 1,
        pg: (j.pg || 0) + (tipo === "V" ? 1 : 0),
        pe: (j.pe || 0) + (tipo === "E" ? 1 : 0),
        pp: (j.pp || 0) + (tipo === "D" ? 1 : 0),
        puntos: (j.puntos || 0) + puntosGanados,
        goles: (j.goles || 0) + golesEnEstePartido,
        ultimos: [tipo, ...(j.ultimos || [])].slice(0, 5),
        historial: [...(j.historial || []), { fecha: partido.fecha, resultado: tipo, goles: golesEnEstePartido, partidoId: partido.id }]
      };
      db.ref("jugadores/" + id).update(nuevos);
    };

    const equipoA = partido.equipoA || [];
    const equipoB = partido.equipoB || [];

    if (resultado === "E") {
      equipoA.forEach(id => actualizar(id, "E"));
      equipoB.forEach(id => actualizar(id, "E"));
    } else if (resultado === "A") {
      equipoA.forEach(id => actualizar(id, "V"));
      equipoB.forEach(id => actualizar(id, "D"));
    } else {
      equipoA.forEach(id => actualizar(id, "D"));
      equipoB.forEach(id => actualizar(id, "V"));
    }

    const golesFinal = {};
    [...equipoA, ...equipoB].forEach(id => { golesFinal[id] = golesDeEsteMatch[id] || 0; });
    db.ref("partidos/" + partido.id).update({ resultado, finalizado: true, goles: golesFinal });
    setGolesPorPartido(g => { const copia = { ...g }; delete copia[partido.id]; return copia; });
  };

  const jugadorDe = (id) => jugadores.find(j => j.id === id) || { id, nombre: "?" };

  return (
    <div className="space-y-3">
      <h3 className="font-bold mb-2">Cargar resultado</h3>
      {pendientes.map(p => {
        const goles = golesPorPartido[p.id] || {};
        if (editandoId === p.id) {
          return <EditorPartido key={p.id} partido={p} jugadores={jugadores} onClose={() => setEditandoId(null)} />;
        }
        return (
          <div key={p.id} className="bg-white rounded-2xl shadow p-3">
            <div className="flex items-center justify-between gap-2 mb-2">
              <p className="font-semibold">{p.fecha}</p>
              <button className="text-[#2E7D32] text-sm font-bold whitespace-nowrap" onClick={() => setEditandoId(p.id)}>✏️ Editar equipos</button>
            </div>
            <p className="text-xs text-gray-500 mb-1">Goles de cada jugador en este partido (opcional):</p>
            <div className="grid grid-cols-2 gap-3 text-sm mb-3">
              <div>
                <p className="font-bold text-blue-700 mb-1">Equipo A</p>
                {(p.equipoA || []).map(id => (
                  <FilaGoles key={id} nombre={jugadorDe(id).nombre}
                    valor={goles[id] || 0}
                    onChange={v => setGol(p.id, id, v)} />
                ))}
              </div>
              <div>
                <p className="font-bold text-red-700 mb-1">Equipo B</p>
                {(p.equipoB || []).map(id => (
                  <FilaGoles key={id} nombre={jugadorDe(id).nombre}
                    valor={goles[id] || 0}
                    onChange={v => setGol(p.id, id, v)} />
                ))}
              </div>
            </div>
            <div className="flex gap-2">
              <button className="bg-[#3E9B33] text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "A")}>Ganó Equipo A</button>
              <button className="bg-gray-500 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "E")}>Empate</button>
              <button className="bg-red-600 text-white rounded-lg px-3 py-2 text-sm font-bold" onClick={() => cargarResultado(p, "B")}>Ganó Equipo B</button>
            </div>
          </div>
        );
      })}
      {pendientes.length === 0 && <p className="text-gray-400 text-center">No hay fechas pendientes de resultado</p>}
    </div>
  );
}

// ============ ADMIN: TEMPORADA ============
function AdminTemporada({ jugadores, partidos, temporadas }) {
  const [nombre, setNombre] = useState("");
  const [imagen, setImagen] = useState(null);
  const tabla = useMemo(() => ordenarTabla(jugadores).filter(j => (j.pj || 0) > 0), [jugadores]);
  const premios = useMemo(() => calcularPremios(jugadores), [jugadores]);
  const pendientes = partidos.filter(p => !p.finalizado).length;
  const nombreFinal = nombre.trim() || ("Temporada " + (temporadas.length + 1));

  const terminar = () => {
    if (premios.length === 0) return alert("Todavía no hay partidos jugados en esta temporada.");
    if (!confirm('¿Terminar "' + nombreFinal + '"?\n\nSe reparten los premios, el puntero se lleva la corona 👑 y se reinician las tablas. No se puede deshacer.')) return;

    const key = db.ref("temporadas").push().key;
    const updates = {};

    // 1) Foto final de la temporada + premios
    const datosTemporada = {
      nombre: nombreFinal,
      cerradaEn: new Date().toISOString(),
      tabla: tabla.map(j => ({
        id: j.id, nombre: j.nombre, foto: j.foto || "", arquero: !!j.arquero,
        pj: j.pj || 0, pg: j.pg || 0, pe: j.pe || 0, pp: j.pp || 0,
        puntos: j.puntos || 0, goles: j.goles || 0,
        promedio: Number(j.promedio.toFixed(2))
      })),
      premios
    };
    updates["temporadas/" + key] = datosTemporada;

    // 2) Reinicio de estadísticas (la calidad, la foto y el arquero se mantienen)
    jugadores.forEach(j => {
      const base = "jugadores/" + j.id + "/";
      updates[base + "pj"] = 0;
      updates[base + "pg"] = 0;
      updates[base + "pe"] = 0;
      updates[base + "pp"] = 0;
      updates[base + "puntos"] = 0;
      updates[base + "goles"] = 0;
      updates[base + "ultimos"] = null;
      updates[base + "historial"] = null;
    });

    // 3) Los partidos ya jugados se archivan; las fechas pendientes pasan a la temporada nueva
    partidos.filter(p => p.finalizado).forEach(p => {
      updates["partidos/" + p.id + "/archivada"] = key;
    });

    db.ref().update(updates)
      .then(() => { setNombre(""); setImagen({ id: key, recien: true, ...datosTemporada }); })
      .catch(err => alert("No se pudo cerrar la temporada: " + err.message));
  };

  const ordenadas = [...temporadas].sort((a, b) => (b.cerradaEn || "").localeCompare(a.cerradaEn || ""));

  return (
    <div>
      <div className="bg-white p-4 rounded-2xl shadow mb-4">
        <h3 className="font-bold mb-2">Terminar temporada</h3>
        <input className="border rounded-lg w-full p-2 mb-3"
          placeholder={"Nombre (por defecto: Temporada " + (temporadas.length + 1) + ")"}
          value={nombre} onChange={e => setNombre(e.target.value)} />

        <p className="text-sm font-semibold mb-1">Premios que se van a repartir:</p>
        {premios.length > 0 ? (
          <div className="bg-[#EEF4EC] rounded-lg p-3 mb-3 space-y-1">
            {premios.map((p, i) => (
              <p key={i} className="text-sm">
                {PREMIOS_META[p.tipo].icono} <b>{PREMIOS_META[p.tipo].nombre}:</b> {p.nombre}
              </p>
            ))}
          </div>
        ) : <p className="text-sm text-gray-400 mb-3">Todavía no hay partidos jugados.</p>}

        <p className="text-xs text-gray-500 mb-3">
          Mejor arquero y equipo ideal (1 arquero + 4 de campo) salen por promedio, entre quienes jugaron al menos la mitad de los partidos del que más jugó.
          {pendientes > 0 && " Las " + pendientes + " fecha(s) pendientes se mantienen para la temporada nueva."}
        </p>

        <button className="bg-yellow-500 text-white rounded-lg px-4 py-2 font-bold" onClick={terminar}>
          🏁 Terminar temporada y premiar
        </button>
      </div>

      <h3 className="font-bold mb-2">Temporadas anteriores</h3>
      <div className="bg-white rounded-2xl shadow divide-y">
        {ordenadas.map(t => {
          const campeon = (t.premios || []).find(p => p.tipo === "campeon");
          return (
            <div key={t.id} className="p-3 flex items-center justify-between gap-2 text-sm">
              <span className="font-semibold">{t.nombre}</span>
              <span className="flex-1 text-right">👑 {campeon ? campeon.nombre : "—"}</span>
              <button className="text-[#2E7D32] font-bold whitespace-nowrap" onClick={() => setImagen(t)}>🖼️ Imagen</button>
            </div>
          );
        })}
        {ordenadas.length === 0 && <p className="p-4 text-center text-gray-400">Todavía no se cerró ninguna temporada</p>}
      </div>
      {imagen && <ImagenTemporada temporada={imagen} cerrada={!!imagen.recien} onClose={() => setImagen(null)} />}
    </div>
  );
}

// ============ PANEL ADMIN (con tabs) ============
function PanelAdmin({ jugadores, partidos, temporadas = [], onSalir }) {
  const [tab, setTab] = useState("jugadores");
  return (
    <div className="max-w-3xl mx-auto p-4">
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-2xl font-bold text-[#1F4D1B]">Panel Admin</h1>
        <button className="text-sm text-gray-500 underline" onClick={onSalir}>Salir</button>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {[["jugadores", "Jugadores"], ["fechas", "Fechas / Sorteo"], ["resultados", "Resultados"], ["temporada", "Temporada"]].map(([k, label]) => (
          <button key={k}
            className={`px-3 py-2 rounded-lg text-sm font-bold ${tab === k ? "bg-[#3E9B33] text-white" : "bg-white text-[#1F4D1B]"}`}
            onClick={() => setTab(k)}>
            {label}
          </button>
        ))}
      </div>
      {tab === "jugadores" && <AdminJugadores jugadores={jugadores} />}
      {tab === "fechas" && <AdminFechas jugadores={jugadores} partidos={partidos} />}
      {tab === "resultados" && <AdminResultados jugadores={jugadores} partidos={partidos} />}
      {tab === "temporada" && <AdminTemporada jugadores={jugadores} partidos={partidos} temporadas={temporadas} />}
    </div>
  );
}

// ============ APP ============
function App() {
  const [jugadores, setJugadores] = useState([]);
  const [partidos, setPartidos] = useState([]);
  const [temporadas, setTemporadas] = useState([]);
  const [vista, setVista] = useState("home"); // home | login | admin
  const [logueado, setLogueado] = useState(false);

  useEffect(() => {
    db.ref("jugadores").on("value", snap => {
      const val = snap.val() || {};
      setJugadores(Object.entries(val).map(([id, v]) => ({ id, ...v })));
    });
    db.ref("partidos").on("value", snap => {
      const val = snap.val() || {};
      setPartidos(Object.entries(val).map(([id, v]) => ({ id, ...v })).filter(p => !p.archivada));
    });
    // Si las reglas de Firebase todavía no dejaban leer "temporadas", la conexión se
    // cancela sola; acá se reintenta cada 5 segundos hasta que funcione.
    const escucharTemporadas = () => {
      db.ref("temporadas").on("value", snap => {
        const val = snap.val() || {};
        setTemporadas(Object.entries(val).map(([id, v]) => ({ id, ...v })));
      }, () => { setTimeout(escucharTemporadas, 5000); });
    };
    escucharTemporadas();
  }, []);

  return (
    <div className="min-h-screen pb-10">
      <nav className="bg-[#1A1F1B] border-b-4 border-[#5CBF4A] text-white p-3 flex items-center justify-center gap-4">
        <div className="bg-white rounded-md px-2 py-1"><img src={LOGO_EMU} alt="EMU SAIC" style={{ height: 22 }} /></div>
        <button className="font-bold" onClick={() => setVista("home")}>Inicio</button>
        <button className="font-bold" onClick={() => setVista(logueado ? "admin" : "login")}>Admin</button>
      </nav>

      {vista === "home" && <Home jugadores={jugadores} partidos={partidos} temporadas={temporadas} esAdmin={logueado} />}
      {vista === "login" && <LoginAdmin onLogin={() => { setLogueado(true); setVista("admin"); }} />}
      {vista === "admin" && logueado && (
        <PanelAdmin jugadores={jugadores} partidos={partidos} temporadas={temporadas} onSalir={() => { setLogueado(false); setVista("home"); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
